<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevNotes - Developer Blog & Community</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">⚡ DevNotes</div>
    <nav class="nav-links">
      <span id="user-greeting" class="user-greeting hidden"></span>
      <button id="auth-btn" class="btn btn-primary" onclick="toggleAuthModal()">Sign In</button>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Ideas, Code & Insights</h1>
      <p>A minimalist publication platform for engineers and builders.</p>
    </section>

    <!-- Post Creation Section (Visible after login) -->
    <section id="create-post-section" class="card create-card hidden">
      <h2>Write a New Story</h2>
      <form id="post-form" onsubmit="handleCreatePost(event)">
        <div class="form-group">
          <label for="post-title">Article Title</label>
          <input type="text" id="post-title" placeholder="Give your post a compelling title..." required />
        </div>
        <div class="form-group">
          <label for="post-content">Story Body</label>
          <textarea id="post-content" rows="4" placeholder="Share your insights..." required></textarea>
        </div>
        <button type="submit" class="btn btn-accent">Publish Story</button>
      </form>
    </section>

    <!-- Blog Feed -->
    <section class="feed-section">
      <h2>Latest Stories</h2>
      <div id="posts-container" class="posts-grid"></div>
    </section>
  </main>

  <!-- Login Modal -->
  <div id="auth-modal" class="modal-backdrop hidden">
    <div class="modal">
      <button class="modal-close" onclick="toggleAuthModal()">&times;</button>
      <h2>Sign In to DevNotes</h2>
      <p class="modal-sub">Enter any username to demo author permissions.</p>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="developer" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
